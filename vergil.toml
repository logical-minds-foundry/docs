[project]
repository-type = "documentation"
versioning-scheme = "none"
branching-model = "docs-single-branch"
release-model = "none"

[ci]
versions = ["latest"]
integration-tests = false

[publish]
release = false
docs = true

[dependencies]
vergil = "v2.1"

[markdownlint]
# Generated pages — long epic URLs and generator formatting trip MD013/MD012.
# They are regenerated by cd-docs-refresh, never hand-edited.
ignore = ["docs/site/docs/roadmap.md", "docs/site/docs/activity.md"]
